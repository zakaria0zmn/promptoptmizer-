target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "T20", # flake8-print
    "PTH", # flake8-use-pathlib
    "ERA", # flake8-eradicate
    "PL",  # pylint
    "TRY", # tryceratops
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # do not perform function calls in argument defaults
    "ANN001", # missing type annotation for argument
    "ANN002", # missing type annotation for keyword argument
    "ANN003", # missing type annotation for return value
    "ANN201", # missing type annotation for method
    "ANN202", # missing type annotation for class method
    "ANN204", # missing type annotation for staticmethod
    "ANN205", # missing type annotation for classmethod
    "ANN206", # missing type annotation for abstract method
    "TRY003", # avoid specifying long messages outside the exception class
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
]

# Per-file ignores
per-file-ignores = {
    "test_*.py" = ["S101", "S106"],
}

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
